<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e8" />
    <script>
      (function () { try { var d = localStorage.getItem('beeoak.web.theme') === 'dark'; document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; } })();
    </script>
    <meta name="description" content="BEE-OAK — discover live events and book tickets with instant QR entry." />
    <title>BEE-OAK · Events & Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" media="print" onload="this.media='all'" />
    <style>
      /* Boot splash: painted before any JS, removed once the app renders */
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #f4f1e8; transition: opacity .35s ease; }
      html[data-theme="dark"] #boot { background: #0d120f; }
      #boot.out { opacity: 0; pointer-events: none; }
      .boot-in { display: grid; justify-items: center; gap: 14px; }
      .boot-logo { width: 92px; height: 78px; display: grid; place-items: center; border-radius: 24px; animation: bootPulse 1.4s ease-in-out infinite; }
      html[data-theme="dark"] .boot-logo { background: #f4f1e8; }
      .boot-logo img { width: 72px; height: 60px; object-fit: contain; }
      .boot-name { font: 400 30px/1 'Bebas Neue', 'DM Sans', system-ui, sans-serif; letter-spacing: .14em; color: #04331f; }
      html[data-theme="dark"] .boot-name { color: #eceae3; }
      .boot-bar { position: relative; width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(4, 51, 31, .12); }
      html[data-theme="dark"] .boot-bar { background: rgba(255, 255, 255, .12); }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #e2b94c; animation: bootBar 1.1s ease-in-out infinite; }
      @keyframes bootPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes bootBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-label="Loading BEE-OAK"><div class="boot-in"><span class="boot-logo"><img src="/logo.png" alt="" /></span><span class="boot-name">BEE·OAK</span><span class="boot-bar"></span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
